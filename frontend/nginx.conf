# Serves the built React app inside the frontend container (port 8080, non-root).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # version.json must never be cached: the smoke test reads it to confirm the new build is live
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed JS/CSS files never change, so browsers can cache them for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
