spring.application.name=notes-api
server.port=8080

# Database: values come from environment variables; defaults after ":" are for local dev only
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:pasalamat}
spring.datasource.username=${POSTGRES_USER:pasalamat}
spring.datasource.password=${POSTGRES_PASSWORD:pasalamat}

# Flyway creates the tables; Hibernate only checks they match the Java classes
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Health endpoint at /health (used by Docker health checks and the smoke test)
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health