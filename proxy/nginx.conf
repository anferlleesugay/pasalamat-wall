# Reverse proxy: the ONLY container with a published port.
# Routes each path to the right service on the user-defined network.

# Docker's internal DNS. Resolving at request time (not only at startup) means
# the proxy keeps working when Jenkins redeploys a service and its IP changes.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 16k;      # notes and studio edits are tiny
    server_tokens off;             # don't advertise the Nginx version

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    set $frontend   frontend:8080;
    set $notes_api  notes-api:8080;
    set $studio_api studio-api:4000;
    set $worker     moderation-worker:8000;
    set $adminer    adminer:8080;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------- APIs ----------
    location /api/notes {
        proxy_pass http://$notes_api;
    }

    location /api/studio {
        proxy_read_timeout 60s;    # shipping waits for Gemini + GitHub
        proxy_pass http://$studio_api;
    }

    # ---------- Health endpoints (used by the Jenkins smoke test) ----------
    location = /health {
        default_type application/json;
        return 200 '{"status":"UP","service":"proxy"}';
    }
    location = /health/notes {
        rewrite ^ /health break;
        proxy_pass http://$notes_api;
    }
    location = /health/studio {
        rewrite ^ /health break;
        proxy_pass http://$studio_api;
    }
    location = /health/worker {
        rewrite ^ /health break;
        proxy_pass http://$worker;
    }

    # ---------- Database admin (Adminer still asks for the DB password) ----------
    location /adminer/ {
        rewrite ^/adminer/(.*)$ /$1 break;
        proxy_pass http://$adminer;
    }

    # ---------- Everything else: the React app ----------
    location / {
        proxy_pass http://$frontend;
    }
}
